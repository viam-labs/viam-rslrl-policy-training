[project]
name = "viam-rl-insert"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["mujoco-warp~=4.0.1", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rl_insert"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
